<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./JSProj.css">
</head>
<body>

    <div 
        id="digitDisplay">Digits:
    </div>
    <div id="confirmationMessage"></div>
    <div id="confirmBox" style="display: none;">
        <p id="confirmText">Is your number correct?
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </p>
    </div>
    <h2>
        Move the little green dude over your phone number using the arrow pad. <br><br>
    </h2>
    <canvas id="canvas1"></canvas>
    <script src="./JSProj.js"></script> <!-- external file only -->
    <script>
        setInterval(() => {
            document.getElementById("digitDisplay").textContent = "Phone Number: " + window.digits.join(", ");
        }, 100);
    </script>
    <script>
        setInterval(() => {
            document.getElementById("digitDisplay").textContent = "Digits: " + window.digits.join("");
        }, 100);
      </script>
</body>
</html>
