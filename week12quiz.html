<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8"/>
    <title>JSON: Task 1</title>
    <style>
      p {
        color: purple;
        margin: 0.5em 0;
      }

      * {
        box-sizing: border-box;
      }
    </style>
    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>

    <section class="preview">



    </section>

  </body>
  <script>
    const section = document.querySelector('section');

    let para1 = document.createElement('p');
    let para2 = document.createElement('p');
    let motherInfo = 'The mother cats are called ';
    let kittenInfo;
    const requestURL = 'https://mdn.github.io/learning-area/javascript/oojs/tasks/json/sample.json';

    fetch(requestURL)
    .then(response => response.text())
    .then(text => displayCatInfo(text))

    function displayCatInfo(catString) {
      let total = 0;
      let female = 0;
      let male = 0;
      let cat_names = [];
      const parsed_cats = JSON.parse(catString);
  
      for(let i = 0; i < parsed_cats.length; i++) {
        cat_names.push(parsed_cats[i].name);
        current = parsed_cats[i];
        for(let j = 0; j < current.kittens.length; j++) {
          const kitten = current.kittens[j];
          total++;
          if(kitten.gender == "f") {
            female++;
          } else {
            male++;
          }
        } 
      }
      
  
      if (cat_names.length > 1) {
        const lastName = cat_names.pop();
        motherInfo += cat_names.join(', ') + ' and ' + lastName;
      } else {
        motherInfo += cat_names[0];
      }
      kittenInfo = "Total: " + (male + female) + " " + "Male: " + male + " " + "Female: " + female;


      // Don't edit the code below here!

      para1.textContent = motherInfo;
      para2.textContent = kittenInfo;
    }

    section.appendChild(para1);
    section.appendChild(para2);
  </script>

</html>
